<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethical Compass</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Ethical Compass</h1>

    <section class="layout">
      <aside class="quiz-panel">
        <div id="quizContainer" style="display:none;">
          <h2>Quiz</h2>
          <div id="quizQuestions"></div>

          <button type="button" id="finishQuizButton">
            Apply Results
          </button>
        </div>
      </aside>

      <div class="canvas-wrapper">
        <canvas id="compassCanvas" width="1200" height="1200"></canvas>
      </div>

      <form id="valuesForm" class="controls">
        <h2>Character Values</h2>

        <div id="manualInputs"></div>

        <button type="button" id="drawButton">Draw Polygon</button>
        <button type="button" id="quizButton">Generate from Quiz</button>
        <button type="button" id="downloadButton">Download PNG</button>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
